  <dl>
      % for s_name in secrets_names:
  <div markdown=1 class='d-flex justify-content-between'>
  <dt class='fw-normal'>${ s_name }</dt>
  <dd class='mb-0'>${ 'Found' if s_name in installer.alkiln_secrets__org else 'Not found' }</dd>
  </div>
