# https://docassemble.org/docs/initial.html#data
variable name: alks_independent_fields
data:
  all_done:
    label: Is this all you want to do?
    field: all_done
    datatype: yesnoradio
  environments:
    label: What types of tests do you need to use?
    field: environments
    datatype: checkboxes
    choices:
      - label: GitHub+You™ tests
        value: github_n_you
      - label: Sandbox™ tests
        value: sandbox
    minlength: 1
  # gh_username:
  #   label: What is your GitHub username?
  #   field: github_username
  gh_owner_type:
    label: What kind of GitHub repository do you want to manage tests for?
    field: gh_owner_type
    datatype: radio
    choices:
      - label: Your personal repository
        value: personal
      - label: A GitHub organization's repository
        value: org
  covets_org_secrets:
    label: Do you want to set secrets?
  github_token_personal:
    label: GitHub individual Personal Access Token (PAT)
    field: installer_token
    datatype: password
    enable if:
      variable: gh_owner_type
      is: personal
    # Mention repo _and_ workflow to avoid confusion from gh auto behavior
    help: |
      The token must have "repo" and "workflow" permissions. For more detailed instructions, skip and continue to the next page.
  github_token_org:
    label: GitHub organization Personal Access Token (PAT)
    field: installer_token
    datatype: password
    enable if:
      variable: gh_owner_type
      is: org
    # Simplifies flow. Permissions overkill sometimes, but not impactful
    help: |
      The token must have "admin:org", "repo", and "workflow" permissions. For more detailed instructions, skip and continue to the next page.
