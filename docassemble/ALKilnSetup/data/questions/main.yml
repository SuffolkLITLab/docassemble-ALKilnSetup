id: has_scopes
# Discuss: We could make permissions much more fine-grained. That is, setting secrets is just admin:org or repo. Do we want to make it that complicated?

# Make sure the developer gave the token the right scopes
code: |
  missing_scopes = []
  if not 'repo' in installer.github.oauth_scopes:
    missing_scopes.append('"repo"')
  if not 'workflow' in installer.github.oauth_scopes:
    missing_scopes.append('"workflow"')
  if gh_owner_type == 'org':
    if not 'admin:org' in installer.github.oauth_scopes:
      missing_scopes.append('"admin:org"')

  if len( missing_scopes ) > 0:
    error = ErrorLikeObject( message='Incorrect Personal Access Token scopes', alk_details=github_pat_scopes_error )
    installer.errors.append( error )
    
  installer.missing_scopes = missing_scopes
