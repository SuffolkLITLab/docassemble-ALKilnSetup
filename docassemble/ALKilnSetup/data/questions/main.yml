code: |
  # Check token credentials
  installer.github = Github( installer.token )
  inst_user = installer.github.get_user()
  try:
    installer.user_name = inst_user.login
  except Exception as setup_err:
    # github.GithubException.BadCredentialsException (401, 403)
    # This error may be missing status and data and message
    log( setup_err.__dict__, 'console' )
    installer.user_name = ''
    setup_error_faux = ErrorLikeObject( message='Incorrect Personal Access Token', alk_details=installer.github_token_error )
    installer.errors.append( setup_error_faux )
  
  if installer.user_name != '':
    installer.missing_scopes
  
  set_github_auth = True
