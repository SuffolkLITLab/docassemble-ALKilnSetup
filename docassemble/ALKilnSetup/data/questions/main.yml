help:
  label: About GitHub secrets
  content: ${ about_secrets }
subquestion: |
  ${ info_so_far }

  <!-- How many secrets can you keep? Not all of them if you're answering these questions! -->

  <!-- Do you want to know a secret? Me either, but we do what we must. Don't worry, you'll probably forget this one. Probably. -->
  
  ALKiln GitHub+You™ tests need information and authorization to run on your server. GitHub+You™ tests can use values you store in encrypted GitHub secrets.
  
  For more information about GitHub secrets press the "About GitHub secrets" button.

  The status of your current GitHub secrets:
  
  % if gh_repo_holder.has_alkiln_secrets__repo:
  Your repository already has ALKiln's standard GitHub secrets[BR]
  % else:
  Your repository does not yet have ALKiln's standard GitHub secrets[BR]
  % endif
  % if '💬🔒 No org perms path' and current_target == 'org_repo':
    % if gh_org_holder.user_role != 'admin':
  This tool is unable to see whether you have standard ALKiln  organization-level GitHub secrets because you are not an admin of ${ gh_org_holder.org.login }. If you need to create the standard ALKiln secrets for your organization, contact an admin of your GitHub organization. Let them know that this setup tool only supports "classic" GitHub tokens.
    % elif not 'admin:org' in installer.github.oauth_scopes:
  This tool is unable to see whether you have standard ALKiln  organization-level GitHub secrets because you did not mark "admin:org" when you made your GitHub Personal Access Token.
    % endif
  % endif
  % if '💬👍 Yes perms path' and current_target == 'org_repo':
    % if gh_org_holder.user_role == 'admin' and 'admin:org' in installer.github.oauth_scopes:
      % if gh_org_holder.has_alkiln_secrets__org:
  Your organization has ALKiln's standard GitHub secrets
      % else:
  Your organization does not yet have ALKiln's standard GitHub secrets
      % endif
    % endif
  % endif

  % if current_target == 'org_repo' and gh_org_holder.user_role == 'admin' and not 'admin:org' in installer.github.oauth_scopes:
  If you do want organization-level secrets, you will need to start this setup again and use a token that includes the "admin:org" permissions. A different token can change a lot of necessary information.
  % endif

  % if current_target == 'org_repo' and gh_org_holder.has_alkiln_secrets__org and gh_repo_holder.has_alkiln_secrets__repo:
  :warning: You have both organization-level secrets and repository-level secrets. We recommend picking just one of those. Repository-level secrets override organization-level secrets and that can get confusing. This form is currently unable to help with removing GitHub secrets. You can still change the values of the existing secrets if you want, though.
  % endif

