  - installer.user
generic object: DAObject
code: |
  existing_secrets_names = []
  alkiln_secrets_found = []
  org_data = x.org
  try:
    org_secrets = org_data.get_secrets()
    existing_secrets_names = [ secret.name for secret in org_secrets ]
  except Exception as secrets_err:
    message = 'Unable to get repository secrets'
    try:
      message = secrets_err.data['message']
    except Exception as _ignore:
      try:
        message = secrets_err.message
      except Exception as _ignore:
        try:
          message = secrets_err.msg
        except Exception as _ignore:
          pass
    secrets_err_faux = ErrorLikeObject( message=message, alk_details='Unable to look for the organization\'s existing GitHub secrets using the permissions that you gave to your GitHub Personal Access Token (PAT).' )
    installer.errors.append( secrets_err_faux )

  if 'SERVER_URL' in existing_secrets_names:
    alkiln_secrets_found.append('SERVER_URL')
  if 'DOCASSEMBLE_DEVELOPER_API_KEY' in existing_secrets_names:
    alkiln_secrets_found.append('DOCASSEMBLE_DEVELOPER_API_KEY')

  installer.alkiln_secrets_org = alkiln_secrets_found
  
  if len( alkiln_secrets_found ) == 2:
    x.has_alkiln_secrets__org = True
  else:
    x.has_alkiln_secrets__org = False
