metadata:
  title: Set up ALKiln automated GitHub tests
  short title: Set up ALKiln tests
  description: Set up ALKiln automated testing GitHub for docassemble interviews. This tool was created in collaboration with the Document Assembly Line project.
---
features:
  question back button: True
  question help button: True
  css:
    - styles.css
---
modules:
  - .al_set_up_testing
---
objects:
  - installer: TestInstaller
---
id: interview order
need:
  - installer
mandatory: True
code: |
  use_original_form = False
  if use_original_form:
    original_alkiln_setup_interview
  
  # ## Blockers ##
  
  # show errors first thing on each loop
  if len( installer.errors ) > 0:
    show_errors

  if just_set_secrets:
    dev_end_screen

  # ## Questions ##

  environments

  # Docassemble authentication
  if ( environments.all_true('github_n_you')):
    get_da_api_key
  
  installer.token
  set_github_auth

  # Org and org secrets
  if gh_owner_type == 'org':
    all_orgs
    gh_org_holder
    if environments.true_values('github_n_you'):
      seek_secrets_desires  # covets_org_secrets may not get defined

  # Repo
  get_repos
  wants_custom_repo
  gh_repo_holder

  # Personal repo secrets
  # Discuss: Offer this screen even to those already setting org secrets?
  # Discuss: Strongly recommend making the secrets if there are none
  # if not defined('covets_org_secrets'):
  gh_repo_holder.has_alkiln_secrets__repo
  covets_repo_secrets

  installer.fill_gh_info

  # Interviews
  if not just_set_secrets:
    interviews_to_test
    prepare_file_data
    installer.set_files_to_push(
      environments=environments.true_values(),
      interviews_to_test=interviews_to_test.true_values()
    )
  
  # dev_between_screen

  is_ready

  log('🍕 over 9000!')
  dev_end_screen
