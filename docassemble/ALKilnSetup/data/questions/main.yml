code: |
  gh_repos_data = []

  chosen_org = gh_org_holder.org

  try:
    if gh_owner_type == 'org':
      gh_repos_data = chosen_org.get_repos(sort='updated')
    else:
      gh_repos_data = installer.user.get_repos(sort='updated')
  except Exception as get_repos_err:
    log( get_repos_err.__dict__, 'console' )
    # Any empty list will just show a text field for a custom repo
    pass
  
  for repo in gh_repos_data:
    # Breaks if don't use a DAObject
    new_repo_holder = repo_holders[ repo_holders.number_gathered() ]
    new_repo_holder.repo = repo
    new_repo_holder.full_name = repo.full_name
  repo_holders.gathered = True
  
  get_repos = True
---
# https://pygithub.readthedocs.io/en/stable/github_objects/Repository.html#github.Repository.Repository.get_secrets
id: repo secrets
need:
  - installer.user
generic object: DAObject
code: |
  secrets_names__repo = []
  alkiln_secrets_found__repo = []
  repo_data = x.repo
  try:
    repo_secrets = repo_data.get_secrets()
    secrets_names__repo = [ secret.name for secret in repo_secrets ]
    repo_secrets = None  # PaginatedList object can't be pickled
  except Exception as secrets_err__repo:
    message = 'Unable to get repository secrets'
    try:
      message = secrets_err__repo.data['message']
    except Exception as _ignore:
      try:
        message = secrets_err__repo.message
      except Exception as _ignore:
        try:
          message = secrets_err__repo.msg
        except Exception as _ignore:
          pass
    secrets_err_faux = ErrorLikeObject( message=message, alk_details='Unable to look for the repository\'s existing GitHub secrets using the permissions that you gave to your GitHub Personal Access Token (PAT).' )
    installer.errors.append( secrets_err_faux )

  if 'SERVER_URL' in secrets_names__repo:
    alkiln_secrets_found__repo.append('SERVER_URL')
  if 'DOCASSEMBLE_DEVELOPER_API_KEY' in secrets_names__repo:
    alkiln_secrets_found__repo.append('DOCASSEMBLE_DEVELOPER_API_KEY')

  installer.alkiln_secrets__repo = alkiln_secrets_found__repo
  
  if len( alkiln_secrets_found__repo ) == 2:
    x.has_alkiln_secrets__repo = True
  else:
    x.has_alkiln_secrets__repo = False
