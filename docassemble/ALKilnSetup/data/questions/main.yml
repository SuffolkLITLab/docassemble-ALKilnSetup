id: secrets desires repo-style
# In 2023, anyone with 'repo' permissions could edit repo secrets through the API, even if not through the UI. It may change.
need:
  - gh_repo_holder.has_alkiln_secrets__repo
question: GitHub repository secrets
subquestion: |
  ${ info_summary }

  How many secrets can you keep? Not all of them if you're answering these questions!

  ALKiln tests need some [GitHub secrets](https://docs.github.com/en/actions/security-guides/encrypted-secrets) in order to run GitHub+You™ tests on your docassemble server. The usual names for these secrets are "SERVER_URL" and "DOCASSEMBLE_DEVELOPER_API_KEY".

  These secrets can be stored for an organization so that all organization tests can have access to them, or they can be stored on an individual repository. This question is about the **repository**. To change organization secrets, a GitHub org admin can run this tool and pick the options to manage an organization.

  % if gh_repo_holder.has_alkiln_secrets__repo:
  <div class='alert alert-success'>
  It looks like this repository already has the standard ALKiln GitHub secrets!
  </div>
  % else:
  This setup tool can help you create the standard ALKiln GitHub secrets for this repository if you want.
  % endif
fields:
  - Do you need to change values of the repository's secrets?: covets_repo_secrets
    datatype: yesnoradio
    show if:
      code: |
        gh_repo_holder.has_alkiln_secrets__repo
  - Do you need to create the standard ALKiln GitHub secrets for this repository?: covets_repo_secrets
    datatype: yesnoradio
    show if:
      code: |
        not gh_repo_holder.has_alkiln_secrets__repo
  - code: |
      [ alks_independent_fields['just_secrets__repo'] ]
