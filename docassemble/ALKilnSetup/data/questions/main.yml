          1. If ALKilnn secrets: Ask if want to update repo secrets
  DA:
    1. Check if user is admin
    1. Show user their email. Ask if this is the test account
      1. If yes, make API key
      1. If no, if permissions, get test account... name? id?
        1. Make API key for test 
      1. If neither, ask them to either
        1. Sign into da as test account
        1. Get them or someone else to make and give the API key

  Info we have/need:
  
  Do we need the user's account, or the test account?
    GitHub:
      need to edit a repo: user account
      need to set repo secrets: user account
      need to pull repo: test account (shall we handle this? not right now?)
    DA:
      need to get token, iirc: test account or priveliged user account
  What info can we get?
  GitHub user name gets us:
    What orgs the user is in (except where they're private members)
    What repos the user can... edit? (except when repos are private)
  Tester docassemble account gets us:
    email (to ask the user if this is the account that will be running tests)
    id the integer ID of the user, which is used in the API and appears in the URLs of Playground files.
    NOT password
    permissions a list of special permissions allowed to the user based on the user’s privileges.
  Permissions:
    can a user get/make their own api keys? (to get or make the test user key)
    If this is the test account user, list their API keys with names and permissions...
    If not, if the user has permissions, same:
      access_user_api_info - see information about other users’ API keys
      edit_user_api_info - modify others users’ API keys (https://docassemble.org/docs/api.html#api_user_user_id_api_post)
