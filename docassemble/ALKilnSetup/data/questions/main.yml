  GitHub+You™ tester account API key
subquestion: |
  Another tricky part is the tester account and its API key.
  
  We {highly recommend} you, your team, or your organization set up a "tester account" on your docassemble server. You can use your account as the {tester account}.
  
  You are logged in as ${ user_info().email }.
fields:
  - Is this the account that will own the Projects that ALKiln will create and use?: is_testing_account
    datatype: yesnoradio
    required: False
  - note: |
      Since the tester account is a different account, you will need to make an API key for the tester account. If you can sign in to the tester account, go to a different browser than this one and log in as the {tester account}. Otherwise, ask someone who has access to the tester account account to make an API key for you and to give you that API key.

      Whoever logs into the account should do the following:
    show if:
      variable: is_testing_account
      is: False
  # ⚠️ Must use fancy quotes with the term to ensure proper term behavior
  - note: |
      Go to [${ installer.server_url_input }/manage_api](${ installer.server_url_input }/manage_api) and [add a new API key](https://docassemble.org/docs/api.html#manage_api). Stay on that page.
      
      1. Make the name of the API key clear about its purpose.
      1. Make sure to {choose “No authentication” as the security method}.
      1. Make sure the key has permission to
          1. Create new Projects.
          1. Go to interviews on the server.
          1. Whatever else you need. For example, permission to sign in on the server.

      Copy the new API key. **You will only be able to see the API key once**. Once you navigate away from the page with the API key, you will not be able to see it again.
  - The API key of the docassemble account: installer.da_api_key
    datatype: password
terms:
  'highly recommend': |
    Tap the "Why have a tester account?" button below to learn why you might want to set up an account on the docassemble server just for running tests.
  tester account: |
    The account that will own the Projects that ALKiln will create and use.
  # ⚠️ Must use fancy quotes with the term to ensure proper term behavior
  choose “No authentication” as the security method: |
    Currently it is impossible to use an IP address when authenticating GitHub+You™ tests. GitHub uses many different IP addresses.
help:
  label: Why make a tester account?
  content: ${ why_special_account }
---
template: why_special_account
content: |
  **Why would you want to set up an account on your docassemble server just for testing?**
  
  1. Using a separate account is more secure. You will give GitHub permission to do things on your server with that account. If you become unsure of the behavior of the account you will at least be able to more easily see where the behvior is coming from. 
  2. A tester account improves logistics. For eample, setting tests up on a developer's account may cause problems in the future. If the developer leaves and the organization deletes their account the tests will fail.
  3. A separate account may reduce confusion for the developer. GitHub will use that account to run the tests. It will create Projects in that account, upload files into those Projects, and then delete those Projects. If a developer is using that docassemble account, they may find it confusing.

  <div markdown=1 class='alert alert-warning'>
  Especially avoid using an admin account as the tester account if possible. The tests for that account will be able to do anything that an admin can do. The tester account must have developer permissions, but it rarely needs more than that.
  </div>
