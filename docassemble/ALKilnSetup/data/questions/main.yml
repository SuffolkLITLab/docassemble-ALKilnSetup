need:
  - installer.server_url_input
question: |
  Docassemble tester account API key
help:
  label: Why make a tester account?
  content: ${ why_special_account }
subquestion: |
  ${ info_so_far }
  
  Setting up a docassemble API key can be tricky the first twenty or thirty times, sorry. ALKiln GitHub+You™ tests do need information and authorization to run tests on your server, though. GitHub+You™ tests can get that authorization from values we can help you store in encrypted GitHub secrets.
  
  We {highly recommend} you, your team, or your organization set up a "{tester account}" on your docassemble server, though you can use your own account as the tester account if you need to.
fields:
  # ⚠️ Must use fancy quotes for term with quotes to ensure proper term behavior
  - note: |
      To make an API token for the tester account you or someone else needs to:

      1. Make sure you are logged into the tester account on ${ installer.server_url_input }
      1. Go to [${ installer.server_url_input }/manage_api](${ installer.server_url_input }/manage_api)
      1. Press to add a new API key
      1. You **must** {choose “No authentication” as the security method}.
      1. Make sure the key has permission to at least:
          1. Create new Projects
          1. Go to interviews on the server
          1. If you are unsure which options to pick, talk to an administrator of ${ installer.server_url_input }
      1. Avoid navigating away from the page until you have copied the API key. **You will only be able to see the API key once**. Once you navigate away, you will not be able to see the API key again.
      1. Press to create the new API key
      1. Copy the API key
      1. If you have a password manager, save it in your password manager
      1. Paste the API key into the field below
      1. You can now close the page with the API key

      You can [read more about adding a new docassemble API key in the docassemble docs](https://docassemble.org/docs/api.html#manage_api).
  - The API key of the docassemble account: installer.da_api_key
    datatype: password
terms:
  highly recommend: |
    Mixing an actual developer's account with an account that runs ALKiln tests can cause problems and confusion. Tap the "Why make a tester account?" to learn more.
  tester account: |
    The account that will store the docassemble Projects that ALKiln will create and test.
  # ⚠️ Must use fancy quotes for term to ensure proper term behavior
  choose “No authentication” as the security method: |
    Currently it is impossible to use an IP address when authenticating GitHub+You™ tests. GitHub uses many different IP addresses.
---
template: why_special_account
content: |
  **Why would you want to set up an account on your docassemble server just for testing?**
  
  1. It means stronger security. For example, if your GitHub account gets compromised, separate accounts can make it easier to tell which account is misbehaving and what it is doing.
  1. It helps with logistics. Setting tests up on a developer's account may cause problems in the future, for one thing. If the developer leaves and the organization deletes their account the tests will fail.
  1. It can aviod confusing account shenanigans. ALKiln will create Projects in the tester account, upload files into those Projects, and then delete those Projects. If a developer is using the same docassemble account, they may find it confusing.

  <div markdown=1 class='alert alert-warning'>
  Especially avoid using an admin account as the tester account if possible. Creating an API token with high levels of access, even by accident, is always best to avoid when possible. The ALKiln tester account must have developer permissions, but it rarely needs more than that.
  </div>
