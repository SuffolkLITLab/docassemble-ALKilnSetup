      ]
validation code: |  # Sets values
  if task_type == 'org_secrets':
    the_coveted_secrets['org'] = True
    the_coveted_secrets['repo'] = False
---
id: github token with explanation
sets: installer.token
question: GitHub authorization info ${ gh_icon__repo }
subquestion: |
  Tricky part here, sorry. We need this authorization no matter what, and doing it now will make everything else easier.
  
  A GitHub Personal Access Token (a PAT) is like a password that will let this ALKiln setup tool make specific changes in GitHub on your behalf. That is why you must create the Personal Access Token in your own GitHub account.

  1. Make sure you are logged into [GitHub](https://github.com).
  1. In [your GitHub settings](https://github.com/settings/tokens/new), follow [up-to-date directions](https://docs.github.com/en/github/authenticating-to-github/creating-a-personal-access-token) to start making your "classic" GitHub Personal Access Token.
  1. Make sure you choose an expiration date for your token that aligns with your organization's or project's security practices
  1. Tap the checkboxes for "repo" and "workflow" scopes
  % if task_type == 'org_repo':
  1. Tap the checkboxes for the "admin:org" scope
  % endif
  1. Finish creating the Personal Access Token
  1. Copy the token and paste it below
fields:
  - code: |
      [ after_gh_owner_type['github_token_fallback'], ]
