code: |
  alkiln_secrets_found = []
  org_data = x.org
  org_secrets = org_data.get_secrets()
  secrets_names = [ secret.name for secret in org_secrets ]

  if 'SERVER_URL' in secrets_names:
    alkiln_secrets_found.append('SERVER_URL')
  if 'DOCASSEMBLE_DEVELOPER_API_KEY' in secrets_names:
    alkiln_secrets_found.append('DOCASSEMBLE_DEVELOPER_API_KEY')

  installer.alkiln_secrets = alkiln_secrets_found
  
  if len( alkiln_secrets_found ) == 2:
    x.has_alkiln_secrets = True
  else:
    x.has_alkiln_secrets = False
