template: which_secrets
content: |
  This tool needs 2 pieces of information to make the necessary GitHub secrets:
  
  1. A docassemble API key so a {tester account} can make Projects on your server that ALKiln will test.
  1. Your server's address so ALKiln can find the tester account on the correct server.
