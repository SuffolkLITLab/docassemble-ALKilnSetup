  ALKiln GitHub+You™ tests will need to create Projects on your docassemble server through GitHub. To do that, they need authorization which we can help you store in encrypted GitHub secrets. You can read more in [the GitHub+You™ documentation](https://assemblyline.suffolklitlab.org/docs/components/ALKiln/setup/#githubNyou-details).
