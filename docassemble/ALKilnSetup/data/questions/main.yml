  installer.branch_name = installer.get_free_branch_name()
---
need:
  - installer.token

# ####
# Check token credentials and set initial token-based values
# ####
code: |
  collected = []
  try:
    installer.github = Github( installer.token )
    collected.append('github')
    installer.user = installer.github.get_user()
    collected.append('user')
    installer.user_name = installer.user.login
    collected.append('login')
  except Exception as setup_err:
    # github.GithubException.BadCredentialsException (401, 403)
    collected.append('error')
    # This error may be missing status and data and message
    log( setup_err.__dict__, 'console' )
    setup_error_faux = ErrorLikeObject( message='Incorrect Personal Access Token', alk_details=installer.github_token_error )
    installer.errors.append( setup_error_faux )

  if not 'login' in collected:
    installer.user_name = None
  if not 'user' in collected:
    installer.user = None
  if not 'github' in collected:
    installer.github = None
  
  if not 'error' in collected:
    installer.missing_scopes  # Watch out for review blocks
  else:
    installer.missing_scopes = ['Found no permission scopes for this GitHub Personal Access Token.']
  
  prep_github_auth = True
---
id: has_scopes
# Discuss: We could make permissions much more fine-grained. That is, setting secrets doesn't need 'workflow'. Do we want to make it that complicated?
need:
  - installer.github

# ####
# Make sure the developer gave the token the right token scopes
# ####
code: |
  missing_scopes = []
  if not 'repo' in installer.github.oauth_scopes:
    missing_scopes.append('"repo"')
  if not 'workflow' in installer.github.oauth_scopes:
    missing_scopes.append('"workflow"')
  if current_target == 'org_secrets':
    if not 'admin:org' in installer.github.oauth_scopes:
      missing_scopes.append('"admin:org"')

  if len( missing_scopes ) > 0:
    scopes_err = ErrorLikeObject( message='Incorrect Personal Access Token scopes', alk_details=github_pat_scopes_error )
    installer.errors.append( scopes_err )
    
  installer.missing_scopes = missing_scopes
---
need:
  - installer.user
  - gh_org_holders
# TODO post MVP: replace all_orgs with gh_org_holders - improvement?

# ####
# Get regular list of all author's orgs. If wants org secrets, ensure author is admin.
# ####
code: |
  import traceback

  ok = False
  try:
    org_pages = installer.user.get_orgs()
    ok = True
  except Exception as err_orgs:
    err_orgs.alk_details = 'We had a problem getting the GitHub organizations you belong to.'
    if not hasattr( err_orgs, 'status' ):
      err_orgs.status = 0
    if not hasattr( err_orgs, 'message'):
      if hasattr( err_orgs, 'msg'):
        err_orgs.message = err_orgs.msg
      else:
        err_orgs.message = '\n'.join(traceback.format_exception(err_orgs))
    if not hasattr( err_orgs, 'data'):
      err_orgs.data = { 'message': err_orgs.message }
      
    installer.errors.append( err_orgs )
    all_orgs = []

  if ok:
    temp_orgs = []
    for org in org_pages:
      membership = installer.user.get_organization_membership( org.login )
      if current_target == 'org_secrets' and membership.role != 'admin':
        continue
      # Breaks if don't use a DAObject
      new_org_holder = gh_org_holders[ gh_org_holders.number_gathered() ]
      new_org_holder.org = org
      new_org_holder.login = org.login
      new_org_holder.user_role = membership.role
      temp_orgs.append( new_org_holder )
    gh_org_holders.gathered = True

    if gh_org_holders.number_gathered() == 0:
      # TODO MVP: add error to installer
      log('🌈 800', 'console')
  
    temp_orgs.sort( key=lambda org : org.login.lower() )
    all_orgs = temp_orgs
