  installer.errors = []
  installer.server_url = installer.server_url_input.rstrip('/')
  
  try:
    # https://docassemble.org/docs/api.html#user
    response = requests.get(installer.server_url + '/api/user', params={ 'key': installer.da_api_key })
    status = response.status_code
    if status == 403:
      # 403 “Access Denied”
      error = ErrorLikeObject( message='Server API Key', alk_details=installer.da_access_denied_error )
      installer.errors.append( error )
    elif status == 400:
      # 400 “Error obtaining user information”
      error = ErrorLikeObject( message='Docassemble user info', alk_details=installer.da_user_info_error )
      installer.errors.append( error )
    else:
      # This triggered a JSON error once. Unable to replicate
      log('🍕 9000', 'console')
      log(response, 'console')
      log(response.json(), 'console')
      installer.da_email = response.json()['email']
  except requests.exceptions.ConnectionError as err:
    # https://docs.python-requests.org/en/latest/user/quickstart/#errors-and-exceptions
    error = ErrorLikeObject( message='Server URL', alk_details=installer.da_server_url_error )
    installer.errors.append( error )
  except requests.exceptions.Timeout as err:
    # https://docs.python-requests.org/en/latest/user/quickstart/#errors-and-exceptions
    error = ErrorLikeObject( message='Server took too long', alk_details=installer.da_server_timeout_error )
    installer.errors.append( error )

  auth_da_info = True
