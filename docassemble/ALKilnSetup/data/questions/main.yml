question: Welcome!
subquestion: |
  This tool can help you set up [ALKiln](https://assemblyline.suffolklitlab.org/docs/components/ALKiln/intro) automated integrated testing for docassemble packages that have a GitHub repository. Specifically, this tool can help you:

  - Create workflow files for a repository that will trigger your tests on GitHub
  - Create or change GitHub secrets for your repository or organization to provide necessary secure information for the tests
  
  :clock: With experience, setup can take about 5 minutes. It can take a while longer if you are unfamiliar with GitHub or docassemble details, or if you need to contact administrators.
  
  We recommend that people using this tool are administrators for the docassemble server and for the necessary GitHub organization or repository, but this tool will make sure you have correct permissions along the way.

  First, choose your testing environments.

  <details markdown=1 class='alert alert-info' style="max-height: unset;">
  <summary>About different testing environments</summary>
  
  ---
  
  1. [GitHub+You™ tests](https://assemblyline.suffolklitlab.org/docs/components/ALKiln/setup/#githubNyou-details) are more sure to work right away. They pull the package into a Project and run tests on your server, so they can slow down your server if the package has modules or if the interview is slow.
  1. [Sandbox™ tests](https://assemblyline.suffolklitlab.org/docs/components/ALKiln/setup/#sandbox-details) may or may not be more complex to get working. They run on GitHub servers and won't disturb your server.
  1. [ALKilnInThePlayground™ tests](https://assemblyline.suffolklitlab.org/docs/components/ALKiln/setup/#diy-details) run on your docassemble server and have nothing to do with GitHub, so we can't help you here. Instead, read [our ALKilnInThePlayground™ setup instructions](https://assemblyline.suffolklitlab.org/docs/components/ALKiln/setup/#diy-details) and [how to create your first test](https://assemblyline.suffolklitlab.org/docs/components/ALKiln/setup#first-test).
  </details>
  
fields:
