code: |
  installer.org = gh_org_holder.org
  installer.repo = gh_repo_holder.repo
  installer.repo_name = gh_repo_holder.repo.name
  installer.package_name = re.sub( r'docassemble-', '', installer.repo_name )
  installer.owner_name = gh_repo_holder.repo.owner.login
  installer.fill_gh_info = True
---
id: installer da attr
code: |
