---
---
id: interview order
need:
  - installer
mandatory: True
code: |
  # #### Some legacy code ####
  # Discuss: Offer choice for original form?
  use_original_form = False
  if use_original_form:
    original_alkiln_setup_interview
  
  secret_type_wanted = None

  # set_parts( pre=info_so_far.content )
  
  # #### Blockers ####
  # show errors first thing on each loop
  if len( installer.errors ) > 0:
    show_errors
  
  # #### Questions ####

  # ## Type of tests
  environments
  if not environments.all_true('github_n_you'):
    neutralize_ALL_SECRETS_vars  # assignments block

  the_coveted_secrets  # Define object before validation code
  task_type
  installer.token

  prep_github_auth  # need to organize the auth stuff
  
  # ## Neutralize unwanted vars ##
  if task_type == 'org_secrets':
    neutralize_ALL_REPO_vars
    secret_type_wanted = 'org' # legacy value
    the_coveted_secrets['org'] = True

  if task_type == 'sole_repo':
    neutralize_ALL_ORG_vars

  # ## Org and repo ##
  if 'org' in task_type:
    gh_org_holders.gathered
    # Unnecessary check?
    if gh_org_holders.number_gathered() == 0:
      installer.errors.clear()
      no_orgs_err = ErrorLikeObject( message='No organizations found', status=status, alk_details='This tool is unable to find any organizations where you have an "admin" role. You might try using a different GitHub Personal Access Token.' )
      installer.errors.append( no_orgs_err )
    gh_org_holder
    set_installer_gh_org_info

  if 'repo' in task_type:
    wait_for_repos_list_warning
    get_repos
    repo_holders.gathered
    wants_custom_repo  # unnecessary to reference here?
    gh_repo_holder
    if not installer.has_correct_permissions():  # Still needed?
      show_errors
    else:
      set_gh_repo_info

  # ## Secrets ##
  if environments.all_true('github_n_you'):
  
    # - Internal test management -
    if url_args.get('alks_test', False):
      secrets_to_pre_set
      set_internal_tests_secrets

    # - Usual flow -
    the_coveted_secrets['repo']
    if the_coveted_secrets.any_true():
      server_url_input
      da_api_key
      set_installer_da_vals
      auth_da_info
    else:
      neutralize_ALL_SECRETS_vars

  # ## Interviews ##
  if wants_feature_file or wants_workflow_files:
    interviews_to_test
    prepare_file_data
    installer.files_to_push
  
  wrap_it_up
---
id: review + github commands + end
code: |
  # Review/confirm
  is_ready

  # Send desired items to github
  set_github_auth
  update_github
  
  # End
  force_ask('next_steps')  # prevent going back

  wrap_it_up = True
