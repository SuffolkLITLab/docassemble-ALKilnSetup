        err_orgs.message = '\n'.join(traceback.format_exception(err_orgs))
    if not hasattr( err_orgs, 'data'):
      err_orgs.data = { 'message': err_orgs.message }
      
    installer.errors.append( err_orgs )
    all_orgs = []

  if ok:
    temp_orgs = []
    for org in org_pages:
      new_org = orgs_holder_list[ orgs_holder_list.number_gathered() ]
      new_org.org = org
      new_org.login = org.login
      # membership = installer.user.get_organization_membership( new_org.login )
      # new_org.user_role = membership.role
      temp_orgs.append( new_org )
    orgs_holder_list.gathered = True
    temp_orgs.sort( key=lambda org : org.login.lower() )
    all_orgs = temp_orgs
