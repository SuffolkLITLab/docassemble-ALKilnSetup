question: GitHub authorization
subquestion: |
  Tricky part here, sorry. No matter what you want to do, in order to make changes on GitHub this setup tool needs your authorization. It's better to get it over with now.
  
  You must create a personal access token (a PAT) in **your personal GitHub account** since you personally are the one giving this tool permission. You can delete the PAT at the end.
  
  1. [Log into your GitHub account](https://github.com).
  1. Follow directions to start making your "classic" personal access token on GitHub. You can find up-to-date directions in a section in [this GitHub documentation page](https://docs.github.com/en/github/authenticating-to-github/creating-a-personal-access-token).
  1. Tap the checkboxes for "repo" and "workflow" permissions.
  % if gh_owner_type == 'org':
  1. Tap the checkboxes for "admin:org" permissions.
  % endif
  1. Finish creating the personal access token.
  1. Copy the token and paste it below.

  % if gh_owner_type == 'personal':
  The token must have "repo" and "workflow" permissions. For more detailed instructions, skip and continue to the next page.
  % else:
  The token must have "admin:org", "repo", and "workflow" permissions. For more detailed instructions, skip and continue to the next page.
  % endif
