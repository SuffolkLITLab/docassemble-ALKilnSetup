# Resources:
# https://pygithub.readthedocs.io/en/stable/github_objects/Organization.html#github.Organization.Organization.get_repos
# https://pygithub.readthedocs.io/en/stable/github_objects/NamedUser.html#github.NamedUser.NamedUser.get_repos
