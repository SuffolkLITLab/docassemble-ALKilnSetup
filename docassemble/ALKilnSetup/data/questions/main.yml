      Sorry about that. This list should have all the
      % if gh_owner_type == 'org':
      organization's
      % endif
      repositories that you have access to. Write the name below and we will try to get that repository.
      
      You might also make sure your GitHub Personal Access Token is for the correct account and has the right permissions. Your GitHub PAT ends with ${ installer.token[-4:] }. Here are all of your PAT permissions: { comma_and_list( installer.github.oauth_scopes ) }.
    show if: wants_custom_repo
