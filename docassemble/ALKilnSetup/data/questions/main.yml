# It looks like your GitHub organziation already has the standard ALKiln GitHub secrets! If you need to change your organization's secrets, though, you need to contact an admin of your GitHub organization. You are missing the right permissions to change them yourself. Note for people who know what fine-grained tokens are: This tool is currently missing support for fine-grained tokens.
# % else:
# Your organization is missing the standard ALKiln GitHub secrets and you are missing permissions to make those secrets. If you need to create these secrets, contact an admin of your GitHub organization. Note for people who know what fine-grained tokens are: This tool is currently missing support for fine-grained tokens.
