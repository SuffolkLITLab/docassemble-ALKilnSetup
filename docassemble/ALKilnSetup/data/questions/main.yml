  - installer.user_name
  - repo_holders

# ####
# Get list of all relevant and accessible repos. Should show private repos.
# ####
code: |
  gh_repos_data = []

  try:
    if current_target == 'org_repo':
      gh_repos_data = gh_org_holder.org.get_repos(sort='updated')
    else:
      unsorted = list( installer.user.get_repos(affiliation='owner') )
      unsorted += list( installer.user.get_repos(affiliation='collaborator') )
      gh_repos_data = sorted(unsorted, key=lambda repo: repo.full_name)

    # Iterate using i and prepend?
    for repo in gh_repos_data:
      # Breaks if don't use a DAObject
      new_repo_holder = repo_holders[ repo_holders.number_gathered() ]
      new_repo_holder.repo = repo
      new_repo_holder.full_name = repo.full_name
  except Exception as get_repos_err:
    log('ALKiS0050', 'console')
    log( get_repos_err, 'console' )
    # Any empty list will just show a text field for a custom repo
    pass

  repo_holders.gathered = True
  get_repos = True
