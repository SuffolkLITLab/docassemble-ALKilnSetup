      This tool also needs authorization to make the right changes on GitHub. For that, it needs a GitHub Personal Access Token from your GitHub account.
    show if: task_type
  # Need gh PAT for pushing/branch/PR and/or secrets, so get it first.
  # TODO: Change `.token` to `.gh_PAT`. More distinct.
  - I want details and instructions for the GitHub Personal Access Token before giving an access token: wants_more_PAT_info
    datatype: yesno
    label above field: True
    js show if: |
      val('task_type') !== null
  - code: |
