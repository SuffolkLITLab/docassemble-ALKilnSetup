template: about_secrets
need:
  - secrets_list
content: |
    #### GitHub secrets

    [GitHub secrets](https://docs.github.com/en/actions/reference/encrypted-secrets) encrypt and store sensitive information that give ALKiln GitHub+You™ tests authorization to run on your server.
    
    ---

    ##### Why do these tests need GitHub secrets?

    GitHub+You™ tests need to make changes on your server. Specifically, they need to create and delete Projects in the tester account's Playground, and pull the correct package from GitHub into those Projects. For that, GitHub+You™ tests need authorization from the tester account on your server. GitHub+You™ tests need to visit the Project's interview or interviews at your server's address so that they can fill in answers like a human user would.

    If you choose to set up secrets, your answers will help this tool set these secrets:

    ${ secrets_list }
    
    ---

    ##### Repository-level and organization-level secrets

    Repository-level GitHub secrets give secrets to one repository. Organization-level secrets can give secrets to any repositories that belong to the organization. It is possible to have both repository-level secrets and organization-level secrets. If a repository-level secret and an organization-level secret have the same name, the repository will use the repository-level secret.

    ---
    
    ##### Who can set GitHub secrets?

    An **organization admin** can [create, edit, review, and change individual repository access policies for their organization-level secrets](https://docs.github.com/en/actions/how-tos/write-workflows/choose-what-workflows-do/use-secrets) on GitHub. This tool lets organization admins create or change the value of the standard ALKiln GitHub secrets.

    A **repository owner**, including admins of an oranization that owns the repository, can [create, review, and change their repository-level GitHub secrets](https://docs.github.com/en/actions/how-tos/write-workflows/choose-what-workflows-do/use-secrets#creating-secrets-for-a-repository) on GitHub. This tool lets repository admins create or change the value of the standard ALKiln GitHub secrets.
    
    A **repository collaborator** can set the standard ALKiln GitHub secrets for the repository through this setup tool. A repository collaborator is unable to set secrets on GitHub itself. Yes, it's confusing. We don't know why GitHub works that way ¯\\\\_(ツ)\_/¯

    If a **repository** has access to **organization-level** secrets, the repository owner will be able to see those organization-level secrets on the same page where they [create the repository-level secrets]((https://docs.github.com/en/actions/how-tos/write-workflows/choose-what-workflows-do/use-secrets#creating-secrets-for-a-repository).
    
    ---

    ##### Does my repository or organization already have GitHub secrets?

    On the GitHub website, people can see the names of any GitHub secrets that they can edit, as described on this page.
    
    This setup tool will try to tell admins, owners, and collaborators about standard ALKiln GitHub secrets that are missing for their organization or repository. For security reasons, this tool won't tell you the names of all of the secrets.

     At the end of this setup process, the setup tool will show a link to the page where someone with permission can see the names of the GitHub repository's available secrets.
    
    ---

    ##### Seeing the values of existing GitHub secrets

    In most cases, [people will be unable see the value of a GitHub secret](https://stackoverflow.com/a/59482124), which is what makes them secure. People can only give the secret a new value. People with knowlege and access to the repository have found ways around this through GitHub workflows ([example 1 of printing a secret](https://stackoverflow.com/a/66603047), [example 2 of printing a secret](https://stackoverflow.com/a/74730219), [example 3 of printing a secret](https://stackoverflow.com/a/59482226)). If you use a GitHub composite action in your workflow that composite action might be able do those same things. ALKiln avoids exposing your secrets and GitHub continues to work to improve the security.
