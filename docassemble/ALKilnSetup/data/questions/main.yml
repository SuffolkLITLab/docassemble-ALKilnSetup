      is: False
---
id: custom repo
if: defined('gh_repo_holder_name')
need:
  - gh_repo_holder_name
code: |
  gh_repo_holder_temp = DAObject()
  
  try:
    gh_repo_holder_temp.repo = installer.github.get_repo( gh_repo_holder_name )
    gh_repo_holder = DAObject(
      'gh_repo_holder',
      repo=gh_repo_holder_temp.repo,
      full_name=gh_repo_holder_temp.repo.full_name
    )
  
  except Exception as repo_by_name_err:
    log( vars(repo_by_name_err), 'console')
    message = 'Unable to find repository'
    status = 0
    try:
      message = repo_by_name_err.data['message']
      status = repo_by_name_err.data['status']
    except Exception as _ignore1:
      log( _ignore1, 'console')
      try:
        message = repo_by_name_err.message
        status = repo_by_name_err.status
      except Exception as _ignore2:
        log( _ignore2, 'console')
        try:
          message = repo_by_name_err.msg
        except Exception as _ignore3:
          log( _ignore3, 'console')
          pass
      repo_by_name_err_faux = ErrorLikeObject(
        status=status,
        message=message,
        alk_details=f'Unable to find a repository called { gh_repo_holder_name }.',
      )
      installer.errors.append( repo_by_name_err_faux )
