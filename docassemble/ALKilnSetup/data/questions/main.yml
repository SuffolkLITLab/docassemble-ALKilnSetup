      1. Copy the API key
      1. If you have a password manager, save it in your password manager
      1. Paste the API key into the field below
      1. You can now close the page with the API key

      You can [read more about adding a new docassemble API key in the docassemble docs](https://docassemble.org/docs/api.html#manage_api).
  - The API key of the docassemble account: installer.da_api_key
