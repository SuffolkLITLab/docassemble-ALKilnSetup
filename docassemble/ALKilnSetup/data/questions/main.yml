need:
  - gh_org_holder
question: GitHub organization secrets
subquestion: |
  ${ info_summary }

  Do you want to know a secret? Me either, but we do what we must. Don't worry, you'll probably forget this one. Probably.

  ALKiln tests need some [GitHub secrets](https://docs.github.com/en/actions/security-guides/encrypted-secrets) in order to run GitHub+You™ tests on your docassemble server. The usual names for these secrets are "SERVER_URL" and "DOCASSEMBLE_DEVELOPER_API_KEY".

  These secrets can be stored for an organization so that all organization tests can have access to them, or they can be stored on an individual repository. This question is about your **organization**.

  % if 'admin:org' in installer.github.oauth_scopes and gh_org_holder.user_role == 'admin':
  % if gh_org_holder.has_alkiln_secrets__org:
  <div class='alert alert-success'>
  It looks like your GitHub organziation already has the standard ALKiln GitHub secrets!
  </div>
  % else:
  This setup tool can help you create the standard ALKiln secrets for your organization if you want.
  % endif
  % else:
  You are missing permissions to make secrets for your organization. If you need to create the standard ALKiln secrets, contact an admin of your GitHub organization. Note for people who know what fine-grained tokens are: This tool is currently missing support for fine-grained tokens.
  % endif
fields:
  - Do you need to change values of the organization's secrets?: covets_org_secrets
    datatype: yesnoradio
    show if:
      code: |
        'admin:org' in installer.github.oauth_scopes and gh_org_holder.user_role == 'admin' and gh_org_holder.has_alkiln_secrets__org
  - Do you need to create the standard ALKiln secrets for your organization?: covets_org_secrets
    datatype: yesnoradio
    show if:
      code: |
        'admin:org' in installer.github.oauth_scopes and gh_org_holder.user_role == 'admin' and (not gh_org_holder.has_alkiln_secrets__org)
  - code: |
      [ alks_independent_fields['all_done'] ]
# Can't get org secrets if not org admin, I think
