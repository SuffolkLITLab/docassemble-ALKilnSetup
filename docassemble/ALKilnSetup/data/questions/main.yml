# ####
# Internally, set the paths and other data for the files we will push to GitHub.

# Args:
#   environments ([str]): Names of GitHub environments in which to run tests
#   interviews_to_test ([str]): Names of interview files for which to write tests

# Sets
#   installer.files_to_push ([{"path": str, "msg": str, "contents": str }])
# ####
code: |
  # def set_files_to_push( self, environments=[], interviews_to_test=[] ):
  
  installer.envrionments = environments
  installer.interviews_to_test = interviews_to_test

  files_to_push_temp = installer.get_workflow_file_dicts( environments )

  if len( interviews_to_test ) > 0:
    test_path = 'docassemble/' + installer.package_name + '/data/sources/interviews_run.feature'
    test_commit_message = f'Add { test_path } for ALKiln automated tests'
    files_to_push_temp.append({
      "path": test_path,
      "msg": test_commit_message,
      "contents": installer.first_feature_file_str
    })

  installer.files_to_push = files_to_push_temp
