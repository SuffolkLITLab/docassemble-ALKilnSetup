# https://docassemble.org/docs/initial.html#data
# ⚠️ include `reconsider: True` or the fields won’t update when you change them and refresh the page
reconsider: True
variable name: alks_independent_fields
data:
  # Discuss: Set GitHub secrets when they give the values, then ask if want to stop, then go on to push files if desired? Would have to add more screens.
  just_secrets__repo:
    label: Do you also want add test files to your GitHub repo?
    field: just_secrets__repo
    datatype: noyesradio
    show if: covets_secrets__repo
  environments:
    label: What types of tests do you need to manage?
    field: environments
    datatype: checkboxes
    choices:
      - label: GitHub+You™ tests
        value: github_n_you
      - label: Sandbox™ tests
        value: sandbox
    minlength: 1
  current_target:
    label: What do you want to manage ALKiln for on GitHub?
    field: current_target
    datatype: radio
    choices:
      - label: An individual repository you are able to edit
        value: sole_repo
      - label: A GitHub organization's repository you are able to edit
        value: org_repo
      - label: Organization-level **settings only** for a GitHub organization where you are an admin
        value: org_secrets
        # Looks like wrong syntax, but the only syntax that works
        show if: |
          environments.all_true('github_n_you')
        help: If you're not sure, pick a different option. This would let you set GitHub secrets without creating any test files. This form will have more information about GitHub secrets later.
  # Both github_token_sole_repo & github_token_org have help text
  # Is the help text worth it? Is a note too noisy?
  github_token_sole_repo:
    label: Your GitHub Personal Access Token (PAT)
    field: installer.token
    datatype: password
    js show if: |
      val('current_target') && val('current_target') == 'sole_repo' && val('wants_more_PAT_info') !== true
    # Instruct both "repo" _and_ "workflow" to avoid confusion from gh auto-selecting "repo" when you select "workflow"
    help: |
      The token must have "repo" and "workflow" permissions. For more detailed instructions, this question and continue to the next page.
  github_token_org:
    label: Your GitHub Personal Access Token (PAT)
    field: installer.token
    datatype: password
    js show if: |
      val('current_target') && val('current_target').includes('org') && val('wants_more_PAT_info') !== true
    # Auth overkill sometimes, but simplifies instructions and not impactful
    help: |
      The token must have "admin:org", "repo", and "workflow" permissions. For more detailed instructions, this question and continue to the next page.
  # `show if:` options tests. Must set `true_val` and `false_val`
  hidden_option_inconsistency_demo:
    label: This should be hidden
    field: show_if_options
    datatype: radio
    choices:
      - label: This should be hidden but isn't
        value: hidden
        show if:
          code: |
            false_val
        help: |
          help text 1
      - label: This should be visible and is
        value: visible
        show if:
          code: |
            true_val
        help: |
          help text 2
      - label: This should be wrong syntax and is hidden
        value: wrong and hidden
        show if: |
          false_val
        help: |
          help text 3
      - label: This should be wrong syntax and is visible
        value: wrong and visible
        show if: |
          true_val
        help: |
          help text 4
