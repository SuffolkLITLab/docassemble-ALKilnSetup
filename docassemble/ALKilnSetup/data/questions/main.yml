# Use the interview url to get the user's Playground id.
code: |
  # Start with clean errors list (idempotent for da's loops).
  installer.errors = []
  
  try:
    # https://docassemble.org/docs/api.html#user
    response = requests.get(installer.server_url + '/api/user', params={ 'key': installer.da_api_key })
  
    status = response.status_code
    if status >= 200 and status < 400:
      installer.da_email = response.json()['email']  # legacy value?
  
    elif status == 403:
      # 403 “Access Denied”
      error = ErrorLikeObject( message='Access denied to the server API Key', status=status, alk_details=installer.da_access_denied_error )
      installer.errors.append( error )
  
    elif status == 400:
      # 400 “Error obtaining user information”
      error = ErrorLikeObject( message='Error getting docassemble user info', status=status, alk_details=installer.da_user_info_error )
      installer.errors.append( error )
  
    elif status == 404:
      error = ErrorLikeObject( message=response, status=status, alk_details=f'ALKilnSetup is unable to find a docassemble server at { installer.server_url }. Are you sure you have the right url? It might help to copy it from the server\'s address bar.')
      installer.errors.append( error )
  
    else:
      log('🖊️ ALKilnSetup unhandled DA API key failure response. Response:', 'console')
      log(response, 'console')
      error = ErrorLikeObject( message=response, status=status, alk_details='ALKiln is unsure why it is unable to use the docassemble API key.' )
      installer.errors.append( error )
  
  except requests.exceptions.ConnectionError as da_key_connection_err:
    # https://docs.python-requests.org/en/latest/user/quickstart/#errors-and-exceptions
    error = ErrorLikeObject( message=da_key_connection_err, alk_details=installer.da_server_url_error )
    installer.errors.append( error )
  
  except requests.exceptions.Timeout as da_key_timeout_err:
    # https://docs.python-requests.org/en/latest/user/quickstart/#errors-and-exceptions
    error = ErrorLikeObject( message=da_key_timeout_err, alk_details=installer.da_server_timeout_error )
    installer.errors.append( error )
  
  except Exception as da_key_err:
    log('🖊️ ALKilnSetup unhandled error using the DA API key. Error:', 'console')
    log(response, 'console')
    status = 0
    message = da_key_err
    try:
      status = da_key_err.status
    except Exception:
      pass
    try:
      message = da_key_err.message
    except Exception:
      try:
        message = da_key_err.msg
      except Exception:
        pass
    error = ErrorLikeObject( message=message, alk_details='Error trying to use the docassemble API key.')
    installer.errors.append( error )

  auth_da_info = True
